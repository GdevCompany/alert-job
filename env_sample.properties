## PARAMETERS USED IN MULTIPLE SERVICES
profile=dev
#Application version
alert_job_version=1.0
#Application domain
domain=aj.gdev.by
##CORE
#notify users about changes in categories for parsing
ALERT_ADMIN_UUIDS=
## GATEWAY
GATEWAY_OAUTH2_CLIENT_REGISTRATION_CLIENT_SECRET=
## config parameters
#config doesn't use it
encrypt_key= 
#Grafana server address
grafana_domain=grafana.gdev.by
#ACME email address
acme_email=grovedev.by@gmail.com
#Database directory
database_directory=/home/app/service/aj/files_prod/apps
#Used by default; after changing, other values may not work
#Keycloak admin password
keycloak_admin_password=admin
#Username with admin role on the Keycloak server
keycloak_admin=admin
#Keycloak server URL
keycloak_url=https://aj.gdev.by/keycloak
#Path to local directory containing this file https://github.com/gdevby/alert-job/blob/main/parser-alert-job/src/main/resources/hubr.txt
parser_config_directory=/home/app/service/aj/config/parser
#Prometheus directory
prometheus_directory=/home/app/service/aj/config/prometheus
#Application logging level
logger_level=INFO
#Database access password, file init.sql have login and password
database_user=alert_job_user
database_user_password=password_replace
#API key for Spring AI (LLM module)
AI_API_KEY=replace_ai_api_key
#Base URL for Spring AI service. E.g. https://api.groq.com/openai
AI_BASE_URL=https://api.groq.com/openai
#Spring AI model in use. E.g. llama-3.1-8b-instant
AI_MODEL=llama-3.1-8b-instant

## PARSER SERVICE PARAMETERS
#Days after which parser refreshes order links
PARSER_UPDATE_LINKS_AFTER_DAYS=30
#Parser polling interval in seconds
PARSER_INTERVAL=60
#Insert parsed categories into database (in current version - not used - used category update scheduler)
PARSER_INSERT_CATEGORIES_ACTIVE=true
#Parser module logging level
LOGGING_LEVEL_BY_GDEV=INFO
#Freelance.ru re-login interval in minutes
RELOGIN_FREELANCE_EVERY_MINUTES=25
#Order page connect/read timeout in milliseconds
TIMEOUT_CONNECT_READ_ORDER=30000
#Freelance.ru premium account login
FREELANCE_RU_ACCOUNT_LOGIN=
#Freelance.ru premium account password
FREELANCE_RU_ACCOUNT_PASSWORD=
#RUB exchange rate fallback
CURRENCY_RATE=90
#Currency rates source URL
CURRENCY_SITE=https://www.cbr-xml-daily.ru/daily_json.js
#Delay before reply request in seconds
DELAY_REPLY_REQUEST=60
#Outbound proxy host
PROXY_HOST=
#Outbound proxy port
PROXY_PORT=0
#Outbound proxy username
PROXY_USERNAME=
#Outbound proxy password
PROXY_PASSWORD=
#Path to proxy file (in 'file' read proxy mode)
PROXY_FILE=
#URL to refresh proxy list every 24 hours (or get proxy in 'url' mode)
PROXY_URL=
#Proxy source mode: URL or FILE
PARSER_PROXY_MODE=file
#Use proxy for Upwork parser
UPWORK_PROXY_ACTIVE=false
#Use proxy for Freelancehunt parser
FREELANCEHUNT_PROXY_ACTIVE=false
#Use proxy for Freelancer.com parser
FREELANCER_PROXY_ACTIVE=false
#Use proxy for Freelance.ru parser
FREELANCERU_PROXY_ACTIVE=false
#Use proxy for YouDo parser
YOUDO_PROXY_ACTIVE=false
#Use proxy for Kwork.ru parser
KWORK_PROXY_ACTIVE=false
#Use proxy for Truelancer parser
TRUELANCER_PROXY_ACTIVE=false
#Use proxy for PeoplePerHour parser
PEOPLEPERHOUR_PROXY_ACTIVE=false
#Use proxy for Workana parser
WORKANA_PROXY_ACTIVE=false
#Use proxy for Weblancer parser
WEBLANCER_PROXY_ACTIVE=false
#Use proxy for Kwork.com parser
KWORKCOM_PROXY_ACTIVE=true
#Use proxy for Flru parser
FLRU_PROXY_ACTIVE=false
#Sites included in cleanup job (comma-separated)
CLEANUP_SITES=
#Parser schedule parameters: fl.ru
#The initial delay is the number of seconds to wait after the application starts before launching the parser for the first time.
PARSER_SCHEDULE_SITES_FLRU_INITIAL_DELAY_SECONDS=300
#Constant delay — the interval between the end of the previous run and the start of the next one.
PARSER_SCHEDULE_SITES_FLRU_FIXED_DELAY_SECONDS=300
#For the other site parsers, the parameters are obtained in a similar way.
#Parser schedule parameters: kwork.ru
PARSER_SCHEDULE_SITES_KWORK_INITIAL_DELAY_SECONDS=600
PARSER_SCHEDULE_SITES_KWORK_FIXED_DELAY_SECONDS=600
#Parser schedule: weblancer.net
