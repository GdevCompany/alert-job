## NOTIFICATION SERVICE PARAMETERS
#Mailbox connection configuration for receiving one-time user codes
#Mail server host for receiving one-time codes (e.g. mail.gdev.by)
MAILBOX_HOST=
#Optional IMAP timeouts/retries (defaults: 15000 / 30000 / 3 / 2000 ms)
#MAILBOX_CONNECTION_TIMEOUT_MS=
#MAILBOX_READ_TIMEOUT_MS=
#MAILBOX_CONNECT_RETRIES=
#MAILBOX_CONNECT_RETRY_DELAY_MS=
#Mailbox username for receiving one-time codes
MAILBOX_USERNAME=
#Mailbox password for receiving one-time codes
MAILBOX_PWD=
#Telegram notifications configuration (token to connect in telagram bot)
TELEGRAM_CHAT_TOKEN=
#Sender email address for outgoing messages
MAIL_FROM_ADDRESS=noreply@gdev.by
#SMTP username (sender address)
MAIL_SMTP_USERNAME=aj@gdev.by
#Password for sender
MAIL_SMTP_PASSWORD=
#Host for SMTP mail for send email notifications
MAIL_SMTP_HOST=smpt.gdev.by
MAIL_SMTP_PORT=587
#app encrypted key for user accounts (AES encrypt, 32 bytes. To generate the key, use, for example, `openssl rand -hex 16` or similar commands.)
APP_ENCRYPTION_KEY=
#Consecutive failures on one proxy before switching to the next (autoreply)
PARSER_AUTOREPLY_PROXY_ATTEMPTS_PER_PROXY=3
#How many times to rotate proxy after attempts-per-proxy exhausted (0 = assigned proxy only)
PARSER_AUTOREPLY_PROXY_MAX_ROTATIONS=2
#Flag to save screenshots in autoreply parser
AUTOREPLY_SCREENSHOTS_ENABLED=false
#Path to save screenshots in autoreply parser
AUTOREPLY_SCREENSHOTS_DIR=./autoreply/screenshots
#URL for get russian proxies
PROXY_ADDITIONAL_URL=
PROXY_CHECK_COUNTRY_ENABLED_PARSER=false
PROXY_CHECK_COUNTRY_ENABLED_NOTIFICATION=true
#Camoufox sidecar (Docker: service name camoufox-launcher; IDE: run camoufox_launcher.py on host)
CAMOUFOX_LAUNCHER_URL=
#Comma-separated SiteName values using Camoufox in autoreply/login (notification only, e.g. WEBLANCER,FLRU)
CAMOUFOX_SITES=
#Save session mode (memory or file)
SAVE_SESSION_MODE=memory
#Direcrory for save session in mode file
PLAYWRIGHT_AUTOREPLY_SESSIONS_DIR=

# 2Captcha (Yandex SmartCaptcha для FL.ru и др., notification / CaptchaService)
TWO_CAPTCHA_ENABLED=false
TWO_CAPTCHA_API_KEY=


